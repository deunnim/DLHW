<!DOCTYPE html>
<html>

<head>
    <title>My Own English Learning App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 100px;
            background-color: #fff4e6;
        }

        h1 {
            color: #ff7f50;
        }

        p {
            font-size: 24px;
            color: #444;
        }

        button {
            font-size: 20px;
            padding: 12px 25px;
            margin: 8px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .correct {
            background-color: #90ee90;
        }

        .wrong1 {
            background-color: #87ceeb;
        }

        .wrong2 {
            background-color: #dda0dd;
        }

        button:hover {
            opacity: 0.8;
        }

        #feedback {
            margin-top: 30px;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>🌟 Vocabulary Quiz 🌟</h1>

    <p>What does <b>"give up"</b> mean?</p>

    <button class="correct" onclick="checkAnswer('quit')">
        Quit
    </button>

    <button class="wrong1" onclick="checkAnswer('start')">
        Start
    </button>

    <button class="wrong2" onclick="checkAnswer('carry')">
        Carry
    </button>

    <h3 id="feedback"></h3>


    <script>

        function checkAnswer(answer) {

            if (answer === "quit") {
                document.getElementById("feedback").innerText =
                    "🎉 Correct! Well done!";
                document.getElementById("feedback").style.color = "green";
            }

            else {
                document.getElementById("feedback").innerText =
                    "❌ Incorrect. The answer is Quit.";
                document.getElementById("feedback").style.color = "red";
            }

        }

    </script>

</body>
</html>
