<!DOCTYPE html>
<html>

<head>
    <title>My Own English Learning App</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 100px;
        }

        button {
            font-size: 20px;
            padding: 12px;
            margin: 5px;
            background-color: skyblue;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>Vocabulary Quiz</h1>

    <p>What does "look after" mean?</p>

    <button onclick="checkAnswer('take care of')">
        Take care of
    </button>

    <button onclick="checkAnswer('look at')">
        Look at
    </button>

    <button onclick="checkAnswer('run away')">
        Run away
    </button>

    <h3 id="feedback"></h3>


    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            if (answer === "take care of") {
                document.getElementById("feedback").innerText =
                    "Correct! Well done!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "Incorrect. The answer is Take care of.";
            }

        }

    </script>

</body>
</html>
